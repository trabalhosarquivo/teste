<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orçador 3D - Versão Pro</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/mrdoob/three.js@r128/examples/js/loaders/STLLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/mrdoob/three.js@r128/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/mrdoob/three.js@r128/examples/js/controls/TransformControls.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        #viewer canvas { width: 100% !important; height: 100% !important; display: block; }
        input[type=number]::-webkit-inner-spin-button { opacity: 1; }
        /* Estilo para o alerta de erro */
        .limit-exceeded { background-color: #ef4444 !important; }
    </style>
</head>
<body class="bg-slate-50 font-sans text-slate-900">
    <div class="max-w-6xl mx-auto py-8 px-4">
        <div class="flex justify-between items-center mb-6 bg-white p-4 rounded-xl shadow-sm border border-slate-200">
            <h1 class="text-2xl font-black text-slate-800 uppercase">Orçador <span class="text-blue-600">3D</span></h1>
            <div class="text-[10px] font-bold text-slate-400 uppercase tracking-widest hidden md:block">W: Mover | E: Girar | R: Escala</div>
        </div>
        
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <div class="lg:col-span-2 space-y-4">
                <div id="drop-zone" class="bg-white border-2 border-dashed border-slate-300 rounded-xl p-8 text-center hover:border-blue-500 transition-all cursor-pointer relative">
                    <p id="status-text" class="text-slate-500 font-black text-xs uppercase">Arraste o arquivo STL ou clique aqui</p>
                    <input type="file" id="fileInput" accept=".stl" class="absolute inset-0 opacity-0 cursor-pointer">
                </div>
                
                <div id="viewer-container" class="relative h-[550px] bg-slate-900 rounded-2xl shadow-2xl overflow-hidden hidden border-4 border-white">
                    <div id="viewer" class="w-full h-full"></div>
                    <div id="size-alert" class="absolute top-4 right-4 bg-red-600 text-white px-4 py-2 rounded-lg font-black text-[10px] uppercase hidden animate-pulse">
                        ⚠️ Tamanho excede a impressora
                    </div>
                    <div class="absolute top-4 left-4 flex flex-col gap-2">
                        <button onclick="setMode('translate')" class="bg-white/90 p-2 rounded-lg text-[10px] font-black shadow-md hover:bg-blue-600 hover:text-white uppercase transition-all">Mover</button>
                        <button onclick="setMode('rotate')" class="bg-white/90 p-2 rounded-lg text-[10px] font-black shadow-md hover:bg-blue-600 hover:text-white uppercase transition-all">Girar</button>
                        <button onclick="setMode('scale')" class="bg-white/90 p-2 rounded-lg text-[10px] font-black shadow-md hover:bg-blue-600 hover:text-white uppercase transition-all">Escalar</button>
                    </div>
                    <div class="absolute bottom-4 right-4 bg-slate-800/90 text-white p-3 rounded-xl text-[11px] backdrop-blur-md">
                        <span id="dims" class="font-mono text-lg">0.0 x 0.0 x 0.0</span> <span class="text-slate-400">mm</span>
                    </div>
                </div>
            </div>

            <div class="space-y-6">
                <div id="controls" class="bg-white p-6 rounded-2xl shadow-xl border border-slate-100 opacity-40 pointer-events-none">
                    <div class="space-y-4">
                        <label class="text-[10px] font-black text-slate-500 uppercase">Selecione a Impressora</label>
                        <select id="printerSelect" onchange="updatePrinterVolume()" class="w-full bg-blue-50 border-2 border-blue-200 rounded-xl p-3 font-bold text-blue-700 outline-none mb-2">
                            <option value="220,240,220">Impressora 01 (22 x 22 x h24 cm)</option>
                            <option value="0,0,0" disabled>Impressora 02 (Indisponível)</option>
                        </select>

                        <label class="text-[10px] font-black text-slate-500 uppercase">Configurações de Impressão</label>
                        
                        <div class="flex gap-2 mb-4">
                            <button onclick="changeColor('#3b82f6')" class="w-8 h-8 rounded-full bg-blue-500 border-2 border-white shadow-md hover:scale-110 transition-all"></button>
                            <button onclick="changeColor('#1e293b')" class="w-8 h-8 rounded-full bg-slate-800 border-2 border-white shadow-md hover:scale-110 transition-all"></button>
                            <button onclick="changeColor('#ffffff')" class="w-8 h-8 rounded-full bg-white border-2 border-slate-200 shadow-md hover:scale-110 transition-all"></button>
                            <button onclick="changeColor('#ef4444')" class="w-8 h-8 rounded-full bg-red-500 border-2 border-white shadow-md hover:scale-110 transition-all"></button>
                        </div>

                        <select id="material" onchange="updatePrice()" class="w-full bg-slate-50 border-2 border-slate-200 rounded-xl p-3 font-bold text-slate-700 outline-none focus:border-blue-500">
                            <option value="0.18">PLA - Pro (R$ 0,18/g)</option>
                            <option value="0.28">PETG - XT (R$ 0,28/g)</option>
                        </select>
                        
                        <select id="infill" onchange="updatePrice()" class="w-full bg-slate-50 border-2 border-slate-200 rounded-xl p-3 font-bold text-slate-700 outline-none focus:border-blue-500">
                            <option value="0.15">15% - Leve</option>
                            <option value="0.45">45% - Resistente</option>
                            <option value="1.00">100% - Total</option>
                        </select>

                        <select id="layerHeight" onchange="updateResolution()" class="w-full bg-slate-50 border-2 border-slate-200 rounded-xl p-3 font-bold text-slate-700 outline-none focus:border-blue-500">
                            <option value="0.3">0.3 mm (Rápido)</option>
                            <option value="0.2">0.2 mm (Normal)</option>
                            <option value="0.1">0.1 mm (Detalhamento)</option>
                        </select>

                        <div class="mt-6 pt-4 border-t border-slate-100 space-y-4">
                            <label class="text-[10px] font-black text-slate-500 uppercase">Ajustes Técnicos</label>
                            
                            <div class="flex items-center gap-3">
                                <span class="text-[10px] font-bold text-slate-400 w-16">ESCALA</span>
                                <input type="number" id="input-scale" step="0.01" value="1.00" oninput="manualTransform()" class="w-full bg-slate-50 border border-slate-200 rounded-lg p-2 text-sm font-bold text-blue-600 outline-none">
                            </div>

                            <div class="grid grid-cols-3 gap-2">
                                <div class="space-y-1">
                                    <span class="text-[9px] font-bold text-slate-400 uppercase">Girar X°</span>
                                    <input type="number" id="input-rotX" value="0" oninput="manualTransform()" class="w-full bg-slate-50 border border-slate-200 rounded-lg p-2 text-xs font-bold outline-none">
                                </div>
                                <div class="space-y-1">
                                    <span class="text-[9px] font-bold text-slate-400 uppercase">Girar Y°</span>
                                    <input type="number" id="input-rotY" value="0" oninput="manualTransform()" class="w-full bg-slate-50 border border-slate-200 rounded-lg p-2 text-xs font-bold outline-none">
                                </div>
                                <div class="space-y-1">
                                    <span class="text-[9px] font-bold text-slate-400 uppercase">Girar Z°</span>
                                    <input type="number" id="input-rotZ" value="0" oninput="manualTransform()" class="w-full bg-slate-50 border border-slate-200 rounded-lg p-2 text-xs font-bold outline-none">
                                </div>
                            </div>
                        </div>
                    </div>

                    <button onclick="resetTransform()" class="w-full mt-4 bg-slate-100 text-slate-500 py-2 rounded-lg text-[10px] font-black border border-slate-200 hover:bg-slate-200 hover:text-slate-700 transition-all uppercase tracking-widest">
                        Resetar Posição Original
                    </button>

                    <div class="mt-4 pt-6 border-t border-slate-100">
                        <div id="price-container" class="bg-blue-600 p-5 rounded-2xl shadow-lg shadow-blue-200 transition-colors duration-300">
                            <span id="total" class="block text-center text-4xl font-black text-white">R$ 0,00</span>
                        </div>
                    </div>
                    <button id="wa-button" onclick="sendWA()" class="w-full bg-slate-800 text-white font-black py-4 rounded-xl mt-6 uppercase text-xs hover:bg-slate-900 transition-all">Enviar para WhatsApp</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let scene, camera, renderer, orbit, transform, mesh, printerVolume;
        let currentVol = 0;
        const viewerDiv = document.getElementById('viewer');

        function initThree() {
            if (scene) return;
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0f172a);
            
            camera = new THREE.PerspectiveCamera(45, viewerDiv.clientWidth / viewerDiv.clientHeight, 0.1, 10000);
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(viewerDiv.clientWidth, viewerDiv.clientHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            viewerDiv.appendChild(renderer.domElement);

            scene.add(new THREE.AmbientLight(0xffffff, 0.8));
            const light = new THREE.DirectionalLight(0xffffff, 0.6);
            light.position.set(200, 200, 200);
            scene.add(light);
            
            const grid = new THREE.GridHelper(500, 50, 0x334155, 0x1e293b);
            scene.add(grid);

            orbit = new THREE.OrbitControls(camera, renderer.domElement);
            transform = new THREE.TransformControls(camera, renderer.domElement);

            transform.addEventListener('change', () => {
                if (mesh) {
                    document.getElementById('input-scale').value = mesh.scale.x.toFixed(2);
                    document.getElementById('input-rotX').value = Math.round(THREE.MathUtils.radToDeg(mesh.rotation.x));
                    document.getElementById('input-rotY').value = Math.round(THREE.MathUtils.radToDeg(mesh.rotation.y));
                    document.getElementById('input-rotZ').value = Math.round(THREE.MathUtils.radToDeg(mesh.rotation.z));
                    
                    keepOnGround();
                    updatePrice();
                }
            });
            
            transform.addEventListener('dragging-changed', (e) => orbit.enabled = !e.value);
            scene.add(transform);
            
            updatePrinterVolume(); // Inicializa a caixa da impressora

            window.addEventListener('resize', onWindowResize);
            window.addEventListener('keydown', (e) => {
                switch(e.key.toLowerCase()) {
                    case 'w': setMode('translate'); break;
                    case 'e': setMode('rotate'); break;
                    case 'r': setMode('scale'); break;
                }
            });

            animate();
        }

        // --- FUNÇÃO PARA ATUALIZAR O VOLUME DA IMPRESSORA SELECIONADA ---
        function updatePrinterVolume() {
            if (printerVolume) scene.remove(printerVolume);
            
            const dims = document.getElementById('printerSelect').value.split(',').map
