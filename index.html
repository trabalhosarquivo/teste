<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orçador Profissional 3D - Pro</title>
    <script src="https://cdn.jsdelivr.net/npm/three@0.145.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.145.0/examples/js/loaders/STLLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.145.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.145.0/examples/js/controls/TransformControls.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        #viewer canvas { width: 100% !important; height: 100% !important; border-radius: 0.75rem; }
    </style>
</head>
<body class="bg-gray-100 font-sans">
    <div class="max-w-6xl mx-auto py-10 px-4">
        <div class="flex justify-between items-center mb-8 border-b pb-4">
            <h1 class="text-3xl font-black text-gray-800 tracking-tight">STUDIO <span class="text-blue-600">3D</span></h1>
            <div class="text-right text-xs text-gray-400 font-bold uppercase tracking-widest">
                Modos: [W] Mover | [E] Girar | [R] Escala
            </div>
        </div>
        
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <div class="lg:col-span-2 bg-white p-4 rounded-2xl shadow-sm border border-gray-200">
                <div id="drop-zone" class="border-2 border-dashed border-gray-200 rounded-xl p-6 text-center hover:border-blue-400 transition-all cursor-pointer mb-4">
                    <p class="text-gray-500 text-sm font-bold uppercase">Carregar arquivo STL</p>
                    <input type="file" id="fileInput" accept=".stl" class="hidden">
                </div>
                
                <div id="viewer-container" class="relative h-[500px] bg-slate-900 rounded-xl overflow-hidden hidden">
                    <div id="viewer" class="w-full h-full"></div>
                    <div class="absolute top-4 left-4 flex gap-2">
                        <button onclick="setMode('translate')" class="bg-white/10 hover:bg-white/20 text-white px-3 py-1 rounded text-xs backdrop-blur-md border border-white/10">Mover (W)</button>
                        <button onclick="setMode('rotate')" class="bg-white/10 hover:bg-white/20 text-white px-3 py-1 rounded text-xs backdrop-blur-md border border-white/10">Girar (E)</button>
                        <button onclick="setMode('scale')" class="bg-white/10 hover:bg-white/20 text-white px-3 py-1 rounded text-xs backdrop-blur-md border border-white/10">Escalar (R)</button>
                    </div>
                    <div class="absolute bottom-4 left-4 bg-black/60 text-white p-3 rounded-lg text-xs backdrop-blur-sm border border-white/10">
                        <p class="font-bold border-b border-white/20 mb-1 pb-1 uppercase tracking-tighter text-blue-400">Dimensões da Peça:</p>
                        <span id="dims">0 x 0 x 0</span> mm
                    </div>
                </div>
            </div>

            <div class="bg-white p-8 rounded-2xl shadow-xl border border-gray-100 flex flex-col justify-between">
                <div id="controls" class="space-y-5 opacity-50 pointer-events-none transition-opacity">
                    <h2 class="text-sm font-black text-gray-400 uppercase tracking-widest mb-4">Parâmetros de Fabricação</h2>
                    
                    <div>
                        <label class="block text-xs font-bold text-gray-600 uppercase mb-2">Material de Impressão</label>
                        <select id="material" class="w-full border-2 border-gray-100 rounded-xl p-3 focus:border-blue-500 outline-none transition-all font-semibold">
                            <option value="0.15">PLA - Standard (R$ 0,15/g)</option>
                            <option value="0.25">PETG - Industrial (R$ 0,25/g)</option>
                            <option value="0.45">FLEX - Maleável (R$ 0,45/g)</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-xs font-bold text-gray-600 uppercase mb-2">Densidade Interna</label>
                        <select id="infill" class="w-full border-2 border-gray-100 rounded-xl p-3 focus:border-blue-500 outline-none font-semibold">
                            <option value="0.15">15% - Preenchimento Leve</option>
                            <option value="0.40">40% - Reforçado</option>
                            <option value="1.00">100% - Peça Maciça</option>
                        </select>
                    </div>

                    <div class="bg-blue-50 p-5 rounded-2xl border border-blue-100 mt-8">
                        <span class="block text-center text-[10px] font-black text-blue-400 mb-1 uppercase tracking-widest">Orçamento Estimado</span>
                        <span id="total" class="block text-center text-4xl font-black text-blue-700">R$ 0.00</span>
                    </div>

                    <button onclick="sendWA()" class="w-full bg-blue-600 text-white font-black py-4 rounded-xl mt-4 hover:bg-blue-700 transition-all shadow-lg shadow-blue-200 flex items-center justify-center gap-2 uppercase text-sm">
                        Confirmar Orçamento via WhatsApp
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const TAXA_SETUP = 15.00;
        const CUSTO_HORA = 12.00;

        let scene, camera, renderer, orbit, transform, mesh;
        let currentVol = 0;
        const viewerDiv = document.getElementById('viewer');

        function initThree() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0xf1f5f9);
            
            camera = new THREE.PerspectiveCamera(45, viewerDiv.clientWidth / viewerDiv.clientHeight, 0.1, 10000);
            
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(viewerDiv.clientWidth, viewerDiv.clientHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            viewerDiv.appendChild(renderer.domElement);

            // Luzes
            scene.add(new THREE.AmbientLight(0xffffff, 0.6));
            const light = new THREE.DirectionalLight(0xffffff, 0.8);
            light.position.set(200, 200, 200);
            scene.add(light);

            // Grid e Eixos
            const grid = new THREE.GridHelper(500, 50, 0xd1d5db, 0xe5e7eb);
            scene.add(grid);

            // Controles
            orbit = new THREE.OrbitControls(camera, renderer.domElement);
            transform = new THREE.TransformControls(camera, renderer.domElement);
            
            // Quando usar o guizo (setas), desabilitar a rotação da câmera
            transform.addEventListener('dragging-changed', (event) => {
                orbit.enabled = !event.value;
                if (!event.value) updatePrice(); // Recalcular ao soltar a escala
            });
            
            scene.add(transform);

            // Atalhos de Teclado
            window.addEventListener('keydown', (e) => {
                switch (e.key.toLowerCase()) {
                    case 'w': transform.setMode('translate'); break;
                    case 'e': transform.setMode('rotate'); break;
                    case 'r': transform.setMode('scale'); break;
                }
            });

            animate();
        }

        function setMode(mode) { if(transform) transform.setMode(mode); }

        function animate() {
            requestAnimationFrame(animate);
            renderer.render(scene, camera);
        }

        document.getElementById('fileInput').onchange = (e) => {
            const file = e.target.files[0];
            if(!file) return;

            const reader = new FileReader();
            reader.onload = (ev) => {
                if(!scene) initThree();
                
                const loader = new THREE.STLLoader();
                const geometry = loader.parse(ev.target.result);
                
                if(mesh) {
                    transform.detach();
                    scene.remove(mesh);
                }
                
                const material = new THREE.MeshPhongMaterial({ color: 0x3b82f6, shininess: 100 });
                mesh = new THREE.Mesh(geometry, material);
                
                geometry.computeBoundingBox();
                const box = geometry.boundingBox;
                const center = new THREE.Vector3();
                box.getCenter(center);
                mesh.position.y = (box.max.y - box.min.y) / 2; // Colocar sobre o grid

                scene.add(mesh);
                transform.attach(mesh);

                // Focar Câmera
                const size = new THREE.Vector3();
                box.getSize(size);
                const maxDim = Math.max(size.x, size.y, size.z);
                camera.position.set(maxDim * 2, maxDim * 2, maxDim * 2);
                camera.lookAt(0,0,0);
                
                currentVol = calculateVolume(geometry) / 1000;
                
                document.getElementById('viewer-container').classList.remove('hidden');
                document.getElementById('controls').classList.remove('opacity-50', 'pointer-events-none');
                
                updatePrice();
            };
            reader.readAsArrayBuffer(file);
        };

        function calculateVolume(geo) {
            let vol = 0;
            const pos = geo.attributes.position.array;
            for(let i=0; i<pos.length; i+=9) {
                const v1 = new THREE.Vector3(pos[i], pos[i+1], pos[i+2]);
                const v2 = new THREE.Vector3(pos[i+3], pos[i+4], pos[i+5]);
                const v3 = new THREE.Vector3(pos[i+6], pos[i+7], pos[i+8]);
                vol += v1.dot(v2.cross(v3)) / 6;
            }
            return Math.abs(vol);
        }

        function updatePrice() {
            if(!mesh) return;

            // Recalcular volume baseado na escala atual
            const scale = mesh.scale.x; 
            const realVol = currentVol * Math.pow(scale, 3);
            
            const box = new THREE.Box3().setFromObject(mesh);
            const size = new THREE.Vector3();
            box.getSize(size);
            document.getElementById('dims').innerText = `${size.x.toFixed(1)} x ${size.y.toFixed(1)} x ${size.z.toFixed(1)}`;

            const matCusto = parseFloat(document.getElementById('material').value);
            const infill = parseFloat(document.getElementById('infill').value);
            
            const peso = realVol * 1.25 * infill;
            const tempo = (realVol / 4);
            
            const total = TAXA_SETUP + (peso * matCusto) + (tempo * CUSTO_HORA);
            
            // GARANTINDO DUAS CASAS DECIMAIS
            document.getElementById('total').innerText = "R$ " + total.toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        }

        document.querySelectorAll('select').forEach(s => s.onchange = updatePrice);

        function sendWA() {
            const total = document.getElementById('total').innerText;
            const dims = document.getElementById('dims').innerText;
            const text = window.encodeURIComponent(`Olá! Orçamento 3D Profissional:\n📦 Dimensões: ${dims} mm\n💳 Valor Total: ${total}\n\nEnvio o arquivo para validação.`);
            window.open(`https://wa.me/55XXXXXXXXXXX?text=${text}`);
        }
        
        document.getElementById('drop-zone').onclick = () => document.getElementById('fileInput').click();
    </script>
</body>
</html>
