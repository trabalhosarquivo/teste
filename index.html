<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orçador Profissional 3D</title>
    <script src="https://cdn.jsdelivr.net/npm/three@0.145.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.145.0/examples/js/loaders/STLLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.145.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        #viewer canvas { width: 100% !important; height: 100% !important; border-radius: 0.75rem; }
    </style>
</head>
<body class="bg-gray-100 font-sans">
    <div class="max-w-6xl mx-auto py-10 px-4">
        <h1 class="text-3xl font-bold text-center mb-10 text-gray-800 border-b pb-4">Painel de Orçamento 3D</h1>
        
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <div class="lg:col-span-2 bg-white p-6 rounded-2xl shadow-sm border border-gray-200">
                <div id="drop-zone" class="border-2 border-dashed border-blue-200 rounded-xl p-8 text-center hover:bg-blue-50 transition-all cursor-pointer">
                    <p class="text-blue-600 font-medium">Arraste seu arquivo STL aqui ou clique para selecionar</p>
                    <input type="file" id="fileInput" accept=".stl" class="hidden">
                </div>
                
                <div id="viewer-container" class="mt-6 relative h-[450px] bg-slate-900 rounded-xl overflow-hidden hidden">
                    <div id="viewer" class="w-full h-full"></div>
                    <div class="absolute bottom-4 left-4 bg-black/60 text-white p-3 rounded-lg text-xs backdrop-blur-sm">
                        <p class="font-bold border-b border-white/20 mb-1 pb-1">Dimensões Reais:</p>
                        <span id="dims" class="text-blue-300 italic">0 x 0 x 0</span> mm
                    </div>
                </div>
            </div>

            <div class="bg-white p-6 rounded-2xl shadow-md border border-gray-200">
                <h2 class="text-xl font-bold mb-6 text-gray-700 font-mono">CONFIGURAÇÕES</h2>
                <div id="controls" class="space-y-4 opacity-50 pointer-events-none transition-opacity">
                    <div>
                        <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Material</label>
                        <select id="material" class="w-full border-2 border-gray-100 rounded-lg p-2.5 focus:border-blue-400 outline-none transition-all">
                            <option value="0.15">PLA - Uso Geral (R$ 0,15/g)</option>
                            <option value="0.22">PETG - Resistente (R$ 0,22/g)</option>
                            <option value="0.35">ABS - Técnico (R$ 0,35/g)</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Preenchimento (Infill)</label>
                        <select id="infill" class="w-full border-2 border-gray-100 rounded-lg p-2.5 focus:border-blue-400 outline-none">
                            <option value="0.15">15% (Decorativo)</option>
                            <option value="0.40">40% (Semi-Estrutural)</option>
                            <option value="1.00">100% (Sólido)</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Resolução de Camada</label>
                        <select id="quality" class="w-full border-2 border-gray-100 rounded-lg p-2.5 focus:border-blue-400 outline-none">
                            <option value="1">Normal (0.2mm)</option>
                            <option value="1.5">Alta Definição (0.12mm)</option>
                            <option value="0.7">Rascunho (0.3mm)</option>
                        </select>
                    </div>

                    <div class="pt-6 border-t border-dashed mt-6">
                        <div class="flex justify-between text-xs text-gray-400 font-bold mb-3">
                            <span>TAXA DE SETUP:</span>
                            <span>R$ 15,00</span>
                        </div>
                        <div class="bg-gray-50 p-4 rounded-xl border border-gray-100">
                            <span class="block text-center text-xs font-bold text-gray-400 mb-1">ORÇAMENTO ESTIMADO</span>
                            <span id="total" class="block text-center text-4xl font-black text-green-600">R$ 0,00</span>
                        </div>
                    </div>

                    <button onclick="sendWA()" class="w-full bg-green-500 text-white font-black py-4 rounded-xl mt-6 hover:bg-green-600 transition-all shadow-lg hover:shadow-green-200 flex items-center justify-center gap-2">
                        FECHAR PEDIDO VIA WHATSAPP
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const TAXA_SETUP = 15.00;
        const CUSTO_HORA = 10.00; 

        let scene, camera, renderer, controls, mesh;
        let currentVol = 0;
        const viewerContainer = document.getElementById('viewer-container');
        const viewerDiv = document.getElementById('viewer');

        function initThree() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0f172a); 
            
            camera = new THREE.PerspectiveCamera(45, viewerDiv.clientWidth / viewerDiv.clientHeight, 0.1, 5000);
            
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(viewerDiv.clientWidth, viewerDiv.clientHeight);
            viewerDiv.appendChild(renderer.domElement);
            
            const ambient = new THREE.AmbientLight(0xffffff, 0.7);
            scene.add(ambient);
            const sun = new THREE.DirectionalLight(0xffffff, 0.6);
            sun.position.set(100, 100, 100);
            scene.add(sun);
            
            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            animate();
        }

        function animate() { 
            requestAnimationFrame(animate); 
            if(controls) controls.update();
            renderer.render(scene, camera); 
        }

        document.getElementById('fileInput').onchange = (e) => {
            const file = e.target.files[0];
            if(!file) return;

            const reader = new FileReader();
            reader.onload = (ev) => {
                if(!scene) initThree();
                
                const loader = new THREE.STLLoader();
                const geometry = loader.parse(ev.target.result);
                
                if(mesh) scene.remove(mesh);
                
                const material = new THREE.MeshPhongMaterial({
                    color: 0x60a5fa,
                    specular: 0x111111,
                    shininess: 100
                });
                
                mesh = new THREE.Mesh(geometry, material);
                
                geometry.computeBoundingBox();
                const box = geometry.boundingBox;
                const size = new THREE.Vector3();
                box.getSize(size);
                
                document.getElementById('dims').innerText = `${size.x.toFixed(1)} x ${size.y.toFixed(1)} x ${size.z.toFixed(1)}`;
                
                const center = new THREE.Vector3();
                box.getCenter(center);
                mesh.position.sub(center);
                scene.add(mesh);

                const maxDim = Math.max(size.x, size.y, size.z);
                camera.position.set(maxDim * 1.5, maxDim * 1.5, maxDim * 1.5);
                camera.lookAt(0,0,0);
                
                currentVol = calculateVolume(geometry) / 1000;
                
                viewerContainer.classList.remove('hidden');
                document.getElementById('controls').classList.remove('opacity-50', 'pointer-events-none');
                
                // Força o redimensionamento do motor 3D
                renderer.setSize(viewerDiv.clientWidth, viewerDiv.clientHeight);
                camera.aspect = viewerDiv.clientWidth / viewerDiv.clientHeight;
                camera.updateProjectionMatrix();
                
                updatePrice();
            };
            reader.readAsArrayBuffer(file);
        };

        function calculateVolume(geo) {
            let vol = 0;
            const pos = geo.attributes.position.array;
            for(let i=0; i<pos.length; i+=9) {
                const v1 = new THREE.Vector3(pos[i], pos[i+1], pos[i+2]);
                const v2 = new THREE.Vector3(pos[i+3], pos[i+4], pos[i+5]);
                const v3 = new THREE.Vector3(pos[i+6], pos[i+7], pos[i+8]);
                vol += v1.dot(v2.cross(v3)) / 6;
            }
            return Math.abs(vol);
        }

        function updatePrice() {
            if(currentVol === 0) return;
            const matCusto = parseFloat(document.getElementById('material').value);
            const infill = parseFloat(document.getElementById('infill').value);
            const qual = parseFloat(document.getElementById('quality').value);
            
            const peso = currentVol * 1.25 * infill;
            const tempo = (currentVol / 4) * qual; 
            
            const total = TAXA_SETUP + (peso * matCusto) + (tempo * CUSTO_HORA);
            document.getElementById('total').innerText = "R$ " + total.toLocaleString('pt-BR', {minimumFractionDigits: 2});
        }

        document.querySelectorAll('select').forEach(s => s.onchange = updatePrice);

        function sendWA() {
            const total = document.getElementById('total').innerText;
            const dims = document.getElementById('dims').innerText;
            const text = window.encodeURIComponent(`Olá! Orçamento de impressão 3D:\n📏 Medidas: ${dims} mm\n💰 Valor: ${total}\n\nEstou enviando o arquivo STL.`);
            window.open(`https://wa.me/55XXXXXXXXXXX?text=${text}`); 
        }
        
        document.getElementById('drop-zone').onclick = () => document.getElementById('fileInput').click();
    </script>
</body>
</html>
