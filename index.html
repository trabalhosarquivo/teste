<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orçador 3D - Versão Pro</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/mrdoob/three.js@r128/examples/js/loaders/STLLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/mrdoob/three.js@r128/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/mrdoob/three.js@r128/examples/js/controls/TransformControls.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        #viewer canvas { width: 100% !important; height: 100% !important; display: block; }
        input[type=number]::-webkit-inner-spin-button { opacity: 1; }
    </style>
</head>
<body class="bg-slate-50 font-sans">
    <div class="max-w-6xl mx-auto py-8 px-4">
        <div class="flex justify-between items-center mb-6 bg-white p-4 rounded-xl shadow-sm border border-slate-200">
            <h1 class="text-2xl font-black text-slate-800 uppercase">Orçador <span class="text-blue-600">3D</span></h1>
            <div class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">W: Mover | E: Girar | R: Escala</div>
        </div>
        
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <div class="lg:col-span-2 space-y-4">
                <div id="drop-zone" class="bg-white border-2 border-dashed border-slate-300 rounded-xl p-8 text-center hover:border-blue-500 transition-all cursor-pointer">
                    <p id="status-text" class="text-slate-500 font-black text-xs uppercase">Arraste o arquivo STL ou clique aqui</p>
                    <input type="file" id="fileInput" accept=".stl" class="hidden">
                </div>
                
                <div id="viewer-container" class="relative h-[550px] bg-slate-900 rounded-2xl shadow-2xl overflow-hidden hidden border-4 border-white">
                    <div id="viewer" class="w-full h-full"></div>
                    <div class="absolute top-4 left-4 flex flex-col gap-2">
                        <button onclick="setMode('translate')" class="bg-white/90 p-2 rounded-lg text-[10px] font-black shadow-md hover:bg-blue-600 hover:text-white uppercase transition-all">Mover</button>
                        <button onclick="setMode('rotate')" class="bg-white/90 p-2 rounded-lg text-[10px] font-black shadow-md hover:bg-blue-600 hover:text-white uppercase transition-all">Girar</button>
                        <button onclick="setMode('scale')" class="bg-white/90 p-2 rounded-lg text-[10px] font-black shadow-md hover:bg-blue-600 hover:text-white uppercase transition-all">Escalar</button>
                    </div>
                    <div class="absolute bottom-4 right-4 bg-slate-800/90 text-white p-3 rounded-xl text-[11px] backdrop-blur-md">
                        <span id="dims" class="font-mono text-lg">0.0 x 0.0 x 0.0</span> <span class="text-slate-400">mm</span>
                    </div>
                </div>
            </div>

            <div class="space-y-6">
                <div id="controls" class="bg-white p-6 rounded-2xl shadow-xl border border-slate-100 opacity-40 pointer-events-none">
                    <div class="space-y-4">
                        <label class="text-[10px] font-black text-slate-500 uppercase">Configurações de Impressão</label>
                        
                        <div class="flex gap-2 mb-4">
                            <button onclick="changeColor('#3b82f6')" class="w-8 h-8 rounded-full bg-blue-500 border-2 border-white shadow-md hover:scale-110 transition-all"></button>
                            <button onclick="changeColor('#1e293b')" class="w-8 h-8 rounded-full bg-slate-800 border-2 border-white shadow-md hover:scale-110 transition-all"></button>
                            <button onclick="changeColor('#ffffff')" class="w-8 h-8 rounded-full bg-white border-2 border-slate-200 shadow-md hover:scale-110 transition-all"></button>
                            <button onclick="changeColor('#ef4444')" class="w-8 h-8 rounded-full bg-red-500 border-2 border-white shadow-md hover:scale-110 transition-all"></button>
                        </div>

                        <select id="material" onchange="updatePrice()" class="w-full bg-slate-50 border-2 border-slate-200 rounded-xl p-3 font-bold text-slate-700 outline-none focus:border-blue-500">
                            <option value="0.18">PLA - Pro (R$ 0,18/g)</option>
                            <option value="0.28">PETG - XT (R$ 0,28/g)</option>
                        </select>
                        
                        <select id="infill" onchange="updatePrice()" class="w-full bg-slate-50 border-2 border-slate-200 rounded-xl p-3 font-bold text-slate-700 outline-none focus:border-blue-500">
                            <option value="0.15">15% - Leve</option>
                            <option value="0.45">45% - Resistente</option>
                            <option value="1.00">100% - Total</option>
                        </select>

                        <select id="layerHeight" onchange="updateResolution()" class="w-full bg-slate-50 border-2 border-slate-200 rounded-xl p-3 font-bold text-slate-700 outline-none focus:border-blue-500">
                            <option value="0.3">0.3 mm (Rápido)</option>
                            <option value="0.2">0.2 mm (Normal)</option>
                            <option value="0.1">0.1 mm (Detalhamento)</option>
                        </select>

                        <div class="mt-6 pt-4 border-t border-slate-100 space-y-4">
                            <label class="text-[10px] font-black text-slate-500 uppercase">Ajustes Técnicos (Replicação)</label>
                            
                            <div class="flex items-center gap-3">
                                <span class="text-[10px] font-bold text-slate-400 w-16">ESCALA</span>
                                <input type="number" id="input-scale" step="0.01" value="1.00" oninput="manualTransform()" class="w-full bg-slate-50 border border-slate-200 rounded-lg p-2 text-sm font-bold text-blue-600 outline-none">
                            </div>

                            <div class="grid grid-cols-3 gap-2">
                                <div class="space-y-1">
                                    <span class="text-[9px] font-bold text-slate-400 uppercase">Girar X°</span>
                                    <input type="number" id="input-rotX" value="0" oninput="manualTransform()" class="w-full bg-slate-50 border border-slate-200 rounded-lg p-2 text-xs font-bold outline-none">
                                </div>
                                <div class="space-y-1">
                                    <span class="text-[9px] font-bold text-slate-400 uppercase">Girar Y°</span>
                                    <input type="number" id="input-rotY" value="0" oninput="manualTransform()" class="w-full bg-slate-50 border border-slate-200 rounded-lg p-2 text-xs font-bold outline-none">
                                </div>
                                <div class="space-y-1">
                                    <span class="text-[9px] font-bold text-slate-400 uppercase">Girar Z°</span>
                                    <input type="number" id="input-rotZ" value="0" oninput="manualTransform()" class="w-full bg-slate-50 border border-slate-200 rounded-lg p-2 text-xs font-bold outline-none">
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="mt-8 pt-6 border-t border-slate-100">
                        <div class="bg-blue-600 p-5 rounded-2xl shadow-lg shadow-blue-200">
                            <span id="total" class="block text-center text-4xl font-black text-white">R$ 0,00</span>
                        </div>
                    </div>
                    <button onclick="sendWA()" class="w-full bg-slate-800 text-white font-black py-4 rounded-xl mt-6 uppercase text-xs hover:bg-slate-900 transition-all">Enviar para WhatsApp</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let scene, camera, renderer, orbit, transform, mesh;
        let currentVol = 0;
        const viewerDiv = document.getElementById('viewer');

        function initThree() {
            if (scene) return;
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0f172a);
            
            camera = new THREE.PerspectiveCamera(45, viewerDiv.clientWidth / viewerDiv.clientHeight, 0.1, 10000);
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(viewerDiv.clientWidth, viewerDiv.clientHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            viewerDiv.appendChild(renderer.domElement);

            scene.add(new THREE.AmbientLight(0xffffff, 0.8));
            const light = new THREE.DirectionalLight(0xffffff, 0.6);
            light.position.set(200, 200, 200);
            scene.add(light);
            
            const grid = new THREE.GridHelper(500, 50, 0x334155, 0x1e293b);
            scene.add(grid);

            orbit = new THREE.OrbitControls(camera, renderer.domElement);
            transform = new THREE.TransformControls(camera, renderer.domElement);

            transform.addEventListener('change', () => {
                if (mesh) {
                    document.getElementById('input-scale').value = mesh.scale.x.toFixed(2);
                    document.getElementById('input-rotX').value = Math.round(THREE.MathUtils.radToDeg(mesh.rotation.x));
                    document.getElementById('input-rotY').value = Math.round(THREE.MathUtils.radToDeg(mesh.rotation.y));
                    document.getElementById('input-rotZ').value = Math.round(THREE.MathUtils.radToDeg(mesh.rotation.z));
                    
                    keepOnGround();
                    updatePrice();
                }
            });
            
            transform.addEventListener('dragging-changed', (e) => orbit.enabled = !e.value);
            scene.add(transform);
            
            window.addEventListener('resize', onWindowResize);
            window.addEventListener('keydown', (e) => {
                switch(e.key.toLowerCase()) {
                    case 'w': setMode('translate'); break;
                    case 'e': setMode('rotate'); break;
                    case 'r': setMode('scale'); break;
                }
            });

            animate();
        }

        function onWindowResize() {
            camera.aspect = viewerDiv.clientWidth / viewerDiv.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(viewerDiv.clientWidth, viewerDiv.clientHeight);
        }

        function manualTransform() {
            if (!mesh) return;
            const s = parseFloat(document.getElementById('input-scale').value) || 0.01;
            const rx = parseFloat(document.getElementById('input-rotX').value) || 0;
            const ry = parseFloat(document.getElementById('input-rotY').value) || 0;
            const rz = parseFloat(document.getElementById('input-rotZ').value) || 0;

            mesh.scale.set(s, s, s);
            mesh.rotation.set(
                THREE.MathUtils.degToRad(rx),
                THREE.MathUtils.degToRad(ry),
                THREE.MathUtils.degToRad(rz)
            );
            keepOnGround();
            updatePrice();
        }

        function keepOnGround() {
            if(!mesh) return;
            mesh.updateMatrixWorld();
            const box = new THREE.Box3().setFromObject(mesh);
            mesh.position.y -= box.min.y;
        }

        function setMode(m) { if(transform) transform.setMode(m); }
        function animate() { requestAnimationFrame(animate); if(renderer) renderer.render(scene, camera); }

        function changeColor(hex) {
            if (mesh && mesh.material.uniforms) {
                mesh.material.uniforms.color.value.set(hex);
            }
        }

        function updateResolution() {
            const res = parseFloat(document.getElementById('layerHeight').value);
            if(mesh && mesh.material.uniforms) {
                mesh.material.uniforms.layerHeight.value = res;
            }
            updatePrice();
        }

        const fileInput = document.getElementById('fileInput');
        const dropZone = document.getElementById('drop-zone');
        dropZone.onclick = () => fileInput.click();

        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
            dropZone.addEventListener(eventName, (e) => { e.preventDefault(); e.stopPropagation(); }, false);
        });

        dropZone.addEventListener('drop', (e) => {
            const file = e.dataTransfer.files[0];
            if (file && file.name.toLowerCase().endsWith('.stl')) handleFile(file);
        });

        fileInput.onchange = (e) => { if(e.target.files[0]) handleFile(e.target.files[0]); };

        function handleFile(file) {
            const reader = new FileReader();
            reader.onload = (ev) => {
                try {
                    initThree();
                    const loader = new THREE.STLLoader();
                    const geometry = loader.parse(ev.target.result);
                    geometry.computeVertexNormals();
                    geometry.center(); // Centraliza a geometria no 0,0,0

                    const materialImpressao = new THREE.ShaderMaterial({
                        uniforms: {
                            color: { value: new THREE.Color(0x3b82f6) },
                            layerHeight: { value: parseFloat(document.getElementById('layerHeight').value) },
                            lightDirection: { value: new THREE.Vector3(1, 1, 1).normalize() }
                        },
                        vertexShader: `
                            varying vec3 vWorldPosition;
                            varying vec3 vNormal;
                            void main() {
                                vNormal = normalize(normalMatrix * normal);
                                vec4 worldPosition = modelMatrix * vec4(position, 1.0);
                                vWorldPosition = worldPosition.xyz;
                                gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                            }
                        `,
                        fragmentShader: `
                            varying vec3 vWorldPosition;
                            varying vec3 vNormal;
                            uniform vec3 color;
                            uniform float layerHeight;
                            uniform vec3 lightDirection;
                            void main() {
                                float dotNL = max(dot(vNormal, lightDirection), 0.0);
                                float intensity = 0.4 + 0.6 * dotNL;
                                float level = fract(vWorldPosition.y / layerHeight);
                                float edge = smoothstep(0.0, 0.15, level) * smoothstep(1.0, 0.85, level);
                                vec3 layerColor = color * (0.8 + 0.2 * edge);
                                gl_FragColor = vec4(layerColor * intensity, 1.0);
                            }
                        `
                    });

                    if(mesh) { transform.detach(); scene.remove(mesh); }
                    mesh = new THREE.Mesh(geometry, materialImpressao);
                    scene.add(mesh);
                    transform.attach(mesh);
                    
                    document.getElementById('viewer-container').classList.remove('hidden');
                    document.getElementById('controls').classList.remove('opacity-40', 'pointer-events-none');
                    document.getElementById('status-text').innerText = "Arquivo: " + file.name;
                    
                    currentVol = calculateVolume(geometry) / 1000;

                    // Ajuste de Câmera e Enquadramento
                    const box = new THREE.Box3().setFromObject(mesh);
                    const size = box.getSize(new THREE.Vector3());
                    const maxDim = Math.max(size.x, size.y, size.z);
                    const fov = camera.fov * (Math.PI / 180);
                    let cameraZ = Math.abs(maxDim / 2 / Math.tan(fov / 2));
                    cameraZ *= 2.5; // Margem extra

                    camera.position.set(cameraZ, cameraZ, cameraZ);
                    camera.lookAt(0, 0, 0);
                    orbit.target.set(0, 0, 0);
                    orbit.update();

                    keepOnGround();
                    updatePrice();
                    onWindowResize();
                } catch (err) { console.error(err); }
            };
            reader.readAsArrayBuffer(file);
        }

        function calculateVolume(geo) {
            let vol = 0;
            const pos = geo.attributes.position.array;
            for(let i=0; i<pos.length; i+=9) {
                const v1 = new THREE.Vector3(pos[i], pos[i+1], pos[i+2]);
                const v2 = new THREE.Vector3(pos[i+3], pos[i+4], pos[i+5]);
                const v3 = new THREE.Vector3(pos[i+6], pos[i+7], pos[i+8]);
                vol += v1.dot(v2.cross(v3)) / 6;
            }
            return Math.abs(vol);
        }

        function updatePrice() {
            if(!mesh) return;
            const custoFilamento = parseFloat(document.getElementById('material').value);
            const scale = mesh.scale.x; 
            const realVol = currentVol * Math.pow(scale, 3);
            const infill = parseFloat(document.getElementById('infill').value);
            const resValue = parseFloat(document.getElementById('layerHeight').value);
            
            let multRes = 1.0;
            if(resValue === 0.2) multRes = 1.2;
            if(resValue === 0.1) multRes = 1.5;

            const peso = (realVol * 1.25 * infill) * 1.1; 
            const precoFinal = ((peso * custoFilamento) * multRes * 1.45) + 3.00;

            const box = new THREE.Box3().setFromObject(mesh);
            const size = new THREE.Vector3(); 
            box.getSize(size);
            
            document.getElementById('dims').innerText = `${size.x.toFixed(1)} x ${size.y.toFixed(1)} x ${size.z.toFixed(1)}`;
            document.getElementById('total').innerText = "R$ " + precoFinal.toFixed(2).replace('.', ',');
        }

        function sendWA() {
            const total = document.getElementById('total').innerText;
            const dims = document.getElementById('dims').innerText;
            const esc = document.getElementById('input-scale').value;
            const rx = document.getElementById('input-rotX').value;
            const ry = document.getElementById('input-rotY').value;
            const rz = document.getElementById('input-rotZ').value;
            const res = document.getElementById('layerHeight').options[document.getElementById('layerHeight').selectedIndex].text;

            let msg = `*Novo Orçamento 3D* 🚀\n\n`;
            msg += `*Medidas Finais:* ${dims} mm\n`;
            msg += `*Resolução:* ${res}\n\n`;
            msg += `*DADOS TÉCNICOS:* \n`;
            msg += `*Escala:* ${esc}x\n`;
            msg += `*Rotação:* X:${rx}° Y:${ry}° Z:${rz}°\n\n`;
            msg += `*Valor Estimado:* ${total}`;

            window.open(`https://wa.me/5511996161878?text=${window.encodeURIComponent(msg)}`);
        }
    </script>
</body>
</html>
