<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orçador 3D - Versão Estável</title>
    <!-- Bibliotecas com versões fixas para evitar incompatibilidade -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/mrdoob/three.js@r128/examples/js/loaders/STLLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/mrdoob/three.js@r128/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/mrdoob/three.js@r128/examples/js/controls/TransformControls.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        #viewer canvas { width: 100% !important; height: 100% !important; display: block; }
    </style>
</head>
<body class="bg-slate-50 font-sans">
    <div class="max-w-6xl mx-auto py-8 px-4">
        <div class="flex justify-between items-center mb-6 bg-white p-4 rounded-xl shadow-sm border border-slate-200">
            <h1 class="text-2xl font-black text-slate-800 uppercase">Orçador <span class="text-blue-600">3D</span></h1>
            <div class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">W: Mover | E: Girar | R: Escala</div>
        </div>
        
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <div class="lg:col-span-2 space-y-4">
                <div id="drop-zone" class="bg-white border-2 border-dashed border-slate-300 rounded-xl p-8 text-center hover:border-blue-500 transition-all cursor-pointer">
                    <p id="status-text" class="text-slate-500 font-black text-xs uppercase">Arraste o arquivo STL ou clique aqui</p>
                    <input type="file" id="fileInput" accept=".stl" class="hidden">
                </div>
                
                <div id="viewer-container" class="relative h-[550px] bg-slate-900 rounded-2xl shadow-2xl overflow-hidden hidden border-4 border-white">
                    <div id="viewer" class="w-full h-full"></div>
                    <div class="absolute top-4 left-4 flex flex-col gap-2">
                        <button onclick="setMode('translate')" class="bg-white/90 p-2 rounded-lg text-[10px] font-black shadow-md hover:bg-blue-600 hover:text-white uppercase transition-all">Mover</button>
                        <button onclick="setMode('rotate')" class="bg-white/90 p-2 rounded-lg text-[10px] font-black shadow-md hover:bg-blue-600 hover:text-white uppercase transition-all">Girar</button>
                        <button onclick="setMode('scale')" class="bg-white/90 p-2 rounded-lg text-[10px] font-black shadow-md hover:bg-blue-600 hover:text-white uppercase transition-all">Escalar</button>
                    </div>
                    <div class="absolute bottom-4 right-4 bg-slate-800/90 text-white p-3 rounded-xl text-[11px] backdrop-blur-md">
                        <span id="dims" class="font-mono text-lg">0.0 x 0.0 x 0.0</span> <span class="text-slate-400">mm</span>
                    </div>
                </div>
            </div>

            <div class="space-y-6">
                <div id="controls" class="bg-white p-6 rounded-2xl shadow-xl border border-slate-100 opacity-40 pointer-events-none">
                    <div class="space-y-4">
                        <label class="text-[10px] font-black text-slate-500 uppercase">Material</label>
                        <select id="material" class="w-full bg-slate-50 border-2 border-slate-200 rounded-xl p-3 font-bold text-slate-700 outline-none focus:border-blue-500">
                            <option value="0.11">PLA - Pro (R$ 0,11/g)</option>
                            <option value="0.28">PETG - XT (R$ 0,28/g)</option>
                        </select>
                        <label class="text-[10px] font-black text-slate-500 uppercase">Preenchimento</label>
                        <select id="infill" class="w-full bg-slate-50 border-2 border-slate-200 rounded-xl p-3 font-bold text-slate-700 outline-none focus:border-blue-500">
                            <option value="0.15">15% - Leve</option>
                            <option value="0.45">45% - Resistente</option>
                            <option value="1.00">100% - Total</option>
                        </select>
                    </div>
                    <div class="mt-8 pt-6 border-t border-slate-100">
                        <div class="bg-blue-600 p-5 rounded-2xl shadow-lg shadow-blue-200">
                            <span id="total" class="block text-center text-4xl font-black text-white">R$ 0,00</span>
                        </div>
                    </div>
                    <button onclick="sendWA()" class="w-full bg-slate-800 text-white font-black py-4 rounded-xl mt-6 uppercase text-xs hover:bg-slate-900 transition-all">Enviar para WhatsApp</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let scene, camera, renderer, orbit, transform, mesh;
        let currentVol = 0;
        const viewerDiv = document.getElementById('viewer');

        function initThree() {
            if (scene) return;
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0f172a);
            
            camera = new THREE.PerspectiveCamera(45, viewerDiv.clientWidth / viewerDiv.clientHeight, 0.1, 5000);
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(viewerDiv.clientWidth, viewerDiv.clientHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            viewerDiv.appendChild(renderer.domElement);

            scene.add(new THREE.AmbientLight(0xffffff, 0.7));
            const light = new THREE.PointLight(0xffffff, 0.8);
            light.position.set(100, 100, 100);
            scene.add(light);
            
            const grid = new THREE.GridHelper(500, 50, 0x334155, 0x1e293b);
            scene.add(grid);

            orbit = new THREE.OrbitControls(camera, renderer.domElement);
            transform = new THREE.TransformControls(camera, renderer.domElement);

            transform.addEventListener('change', () => {
                if (mesh) {
                    keepOnGround();
                    updatePrice();
                }
            });
            transform.addEventListener('dragging-changed', (e) => orbit.enabled = !e.value);
            scene.add(transform);
            
            animate();
        }

        function keepOnGround() {
            if(!mesh) return;
            mesh.updateMatrixWorld();
            const box = new THREE.Box3().setFromObject(mesh);
            mesh.position.y -= box.min.y;
        }

        function setMode(m) { if(transform) transform.setMode(m); }
        function animate() { requestAnimationFrame(animate); if(renderer) renderer.render(scene, camera); }

        const fileInput = document.getElementById('fileInput');
        const dropZone = document.getElementById('drop-zone');

        dropZone.onclick = () => fileInput.click();

        fileInput.onchange = (e) => {
            const file = e.target.files[0];
            if(!file) return;
            
            const reader = new FileReader();
            reader.onload = (ev) => {
                try {
                    initThree();
                    const loader = new THREE.STLLoader();
                    const geometry = loader.parse(ev.target.result);
                    
                    if(mesh) { transform.detach(); scene.remove(mesh); }
                    
                    mesh = new THREE.Mesh(geometry, new THREE.MeshPhongMaterial({ color: 0x3b82f6, shininess: 50 }));
                    geometry.center();
                    scene.add(mesh);
                    transform.attach(mesh);
                    
                    document.getElementById('viewer-container').classList.remove('hidden');
                    document.getElementById('controls').classList.remove('opacity-40', 'pointer-events-none');
                    document.getElementById('status-text').innerText = "Arquivo: " + file.name;

                    setTimeout(() => {
                        const w = viewerDiv.clientWidth;
                        const h = viewerDiv.clientHeight;
                        renderer.setSize(w, h);
                        camera.aspect = w / h;
                        camera.updateProjectionMatrix();

                        keepOnGround();
                        
                        const box = new THREE.Box3().setFromObject(mesh);
                        const size = new THREE.Vector3();
                        box.getSize(size);
                        const maxDim = Math.max(size.x, size.y, size.z);
                        camera.position.set(maxDim * 1.5, maxDim * 1.5, maxDim * 1.5);
                        camera.lookAt(0, 0, 0);
                        orbit.target.set(0, 0, 0);
                        orbit.update();

                        currentVol = calculateVolume(geometry) / 1000;
                        updatePrice();
                    }, 100);
                } catch (err) {
                    alert("Erro ao processar o arquivo STL. Verifique se o arquivo está íntegro.");
                    console.error(err);
                }
            };
            reader.readAsArrayBuffer(file);
        };

        function calculateVolume(geo) {
            let vol = 0;
            const pos = geo.attributes.position.array;
            for(let i=0; i<pos.length; i+=9) {
                const v1 = new THREE.Vector3(pos[i], pos[i+1], pos[i+2]);
                const v2 = new THREE.Vector3(pos[i+3], pos[i+4], pos[i+5]);
                const v3 = new THREE.Vector3(pos[i+6], pos[i+7], pos[i+8]);
                vol += v1.dot(v2.cross(v3)) / 6;
            }
            return Math.abs(vol);
        }

       function updatePrice() {
    if(!mesh) return;
    const custoFilamento = parseFloat(document.getElementById('material').value);
    const scale = mesh.scale.x; 
    const realVol = currentVol * Math.pow(scale, 3);
    const infill = parseFloat(document.getElementById('infill').value);
    
    // --- COLE O NOVO CÁLCULO DE SUPORTE AQUI ---
    let volumeSuporteExtra = 0;
    mesh.updateMatrixWorld(); // Garante que a posição atual seja considerada
    const normalMatrix = new THREE.Matrix3().getNormalMatrix(mesh.matrixWorld);
    const positions = mesh.geometry.attributes.position.array;
    const normals = mesh.geometry.attributes.normal.array;

    for (let i = 0; i < positions.length; i += 9) {
        const worldNormal = new THREE.Vector3(normals[i], normals[i+1], normals[i+2]);
        worldNormal.applyMatrix3(normalMatrix).normalize();

        // Se a face aponta para baixo (ângulo de suporte < 45°)
        if (worldNormal.y < -0.7) { 
            const vA = new THREE.Vector3(positions[i], positions[i+1], positions[i+2]).applyMatrix4(mesh.matrixWorld);
            const vB = new THREE.Vector3(positions[i+3], positions[i+4], positions[i+5]).applyMatrix4(mesh.matrixWorld);
            const vC = new THREE.Vector3(positions[i+6], positions[i+7], positions[i+8]).applyMatrix4(mesh.matrixWorld);
            
            const areaTriangulo = new THREE.Triangle(vA, vB, vC).getArea();
            const alturaMedia = (vA.y + vB.y + vC.y) / 3;
            
            // Projeta o volume até o chão (Y=0) com densidade de 15%
            volumeSuporteExtra += (areaTriangulo * alturaMedia) * 0.15;
        }
    }

    const volumeTotalComSuporte = realVol + (volumeSuporteExtra / 1000); 
    const peso = volumeTotalComSuporte * 1.25 * infill;
    // -------------------------------------------

    const precoFinal = (peso * custoFilamento * 1.45) + 3.00;

    // Atualização visual (Dimensões e Preço com 2 casas decimais)
    const box = new THREE.Box3().setFromObject(mesh);
    const size = new THREE.Vector3(); 
    box.getSize(size);
    document.getElementById('dims').innerText = `${size.x.toFixed(1)} x ${size.y.toFixed(1)} x ${size.z.toFixed(1)}`;
    document.getElementById('total').innerText = "R$ " + precoFinal.toFixed(2).replace('.', ',');
}

        function sendWA() {
            const total = document.getElementById('total').innerText;
            const dims = document.getElementById('dims').innerText;
            const text = window.encodeURIComponent(`Olá! Fiz um orçamento no Orçador 3D:\n📏 Medidas: ${dims} mm\n💰 Valor Estimado: ${total}\n\nO que acha?`);
            window.open(`https://wa.me/55XXXXXXXXXXX?text=${text}`);
        }
    </script>
</body>
</html>
