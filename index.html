<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orçador Profissional 3D</title>
    <script src="https://cdn.jsdelivr.net/npm/three@0.145.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.145.0/examples/js/loaders/STLLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.145.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans">
    <div class="max-w-6xl mx-auto py-10 px-4">
        <h1 class="text-3xl font-bold text-center mb-10 text-gray-800 border-b pb-4">Painel de Orçamento 3D</h1>
        
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <!-- Coluna 1: Upload e Preview -->
            <div class="lg:col-span-2 bg-white p-6 rounded-2xl shadow-sm border border-gray-200">
                <div id="drop-zone" class="border-2 border-dashed border-blue-200 rounded-xl p-8 text-center hover:bg-blue-50 transition-all cursor-pointer">
                    <p class="text-blue-600 font-medium">Arraste seu arquivo STL aqui ou clique para selecionar</p>
                    <input type="file" id="fileInput" accept=".stl" class="hidden">
                </div>
                
                <div id="viewer-container" class="mt-6 relative h-[400px] bg-slate-900 rounded-xl overflow-hidden hidden">
                    <div id="viewer" class="w-full h-full"></div>
                    <div class="absolute bottom-4 left-4 bg-black/50 text-white p-2 rounded text-xs">
                        Dimensões: <span id="dims">0 x 0 x 0</span> mm
                    </div>
                </div>
            </div>

            <!-- Coluna 2: Configurações e Preço -->
            <div class="bg-white p-6 rounded-2xl shadow-md border border-gray-200">
                <h2 class="text-xl font-bold mb-6 text-gray-700">Configurações</h2>
                
                <div id="controls" class="space-y-4 opacity-50 pointer-events-none">
                    <div>
                        <label class="block text-sm font-semibold text-gray-600 mb-1">Material</label>
                        <select id="material" class="w-full border rounded-lg p-2 focus:ring-2 focus:ring-blue-500 outline-none">
                            <option value="0.15">PLA - Uso Geral (R$ 0,15/g)</option>
                            <option value="0.22">PETG - Resistente (R$ 0,22/g)</option>
                            <option value="0.35">ABS - Técnico (R$ 0,35/g)</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-sm font-semibold text-gray-600 mb-1">Preenchimento (Infill)</label>
                        <select id="infill" class="w-full border rounded-lg p-2 focus:ring-2 focus:ring-blue-500 outline-none">
                            <option value="0.15">15% (Decorativo)</option>
                            <option value="0.40">40% (Semi-Estrutural)</option>
                            <option value="0.80">80% (Funcional/Pesado)</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-sm font-semibold text-gray-600 mb-1">Qualidade de Impressão</label>
                        <select id="quality" class="w-full border rounded-lg p-2 focus:ring-2 focus:ring-blue-500 outline-none">
                            <option value="1">Normal (0.2mm)</option>
                            <option value="1.5">Fina (0.12mm) - Mais lento</option>
                            <option value="0.8">Rascunho (0.28mm) - Mais rápido</option>
                        </select>
                    </div>

                    <div class="pt-6 border-t mt-6">
                        <div class="flex justify-between text-sm text-gray-500 mb-2">
                            <span>Setup de Máquina:</span>
                            <span>R$ 15,00</span>
                        </div>
                        <div class="flex justify-between items-center">
                            <span class="font-bold text-gray-700">Valor Total:</span>
                            <span id="total" class="text-3xl font-black text-green-600">R$ 0,00</span>
                        </div>
                    </div>

                    <button onclick="sendWA()" class="w-full bg-green-500 text-white font-bold py-4 rounded-xl mt-6 hover:bg-green-600 transition-colors shadow-lg flex items-center justify-center gap-2">
                        Enviar para WhatsApp
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Lógica de cálculo inspirada em bureaus profissionais
        const TAXA_SETUP = 15.00;
        const CUSTO_HORA = 8.00; // Valor médio da hora de impressão

        let scene, camera, renderer, controls, mesh;
        let currentVol = 0;
        const viewerContainer = document.getElementById('viewer-container');

        // Inicialização do Visualizador (Igual à do passo anterior)
        function initThree() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(45, viewerContainer.clientWidth / viewerContainer.clientHeight, 0.1, 1000);
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(viewerContainer.clientWidth, viewerContainer.clientHeight);
            document.getElementById('viewer').appendChild(renderer.domElement);
            
            const ambient = new THREE.AmbientLight(0xffffff, 0.8);
            scene.add(ambient);
            const directional = new THREE.DirectionalLight(0xffffff, 0.5);
            directional.position.set(10, 10, 10);
            scene.add(directional);
            
            controls = new THREE.OrbitControls(camera, renderer.domElement);
            animate();
        }

        function animate() { requestAnimationFrame(animate); renderer.render(scene, camera); }

        document.getElementById('fileInput').onchange = (e) => {
            const file = e.target.files[0];
            const reader = new FileReader();
            reader.onload = (ev) => {
                const loader = new THREE.STLLoader();
                const geometry = loader.parse(ev.target.result);
                if(mesh) scene.remove(mesh);
                mesh = new THREE.Mesh(geometry, new THREE.MeshPhongMaterial({color: 0x3b82f6}));
                
                geometry.computeBoundingBox();
                const box = geometry.boundingBox;
                const size = new THREE.Vector3();
                box.getSize(size);
                document.getElementById('dims').innerText = `${size.x.toFixed(1)} x ${size.y.toFixed(1)} x ${size.z.toFixed(1)}`;
                
                // Centralização
                const center = new THREE.Vector3();
                box.getCenter(center);
                mesh.position.sub(center);
                scene.add(mesh);
                camera.position.set(size.x, size.y, size.z * 2);
                
                // Volume mm3 -> cm3
                currentVol = calculateVolume(geometry) / 1000;
                
                document.getElementById('viewer-container').classList.remove('hidden');
                document.getElementById('controls').classList.remove('opacity-50', 'pointer-events-none');
                updatePrice();
            };
            reader.readAsArrayBuffer(file);
        };

        function calculateVolume(geo) {
            let vol = 0;
            const pos = geo.attributes.position.array;
            for(let i=0; i<pos.length; i+=9) {
                const v1 = new THREE.Vector3(pos[i], pos[i+1], pos[i+2]);
                const v2 = new THREE.Vector3(pos[i+3], pos[i+4], pos[i+5]);
                const v3 = new THREE.Vector3(pos[i+6], pos[i+7], pos[i+8]);
                vol += v1.dot(v2.cross(v3)) / 6;
            }
            return Math.abs(vol);
        }

        function updatePrice() {
            const materialCusto = parseFloat(document.getElementById('material').value);
            const infillPerc = parseFloat(document.getElementById('infill').value);
            const qualityMult = parseFloat(document.getElementById('quality').value);
            
            // Peso estimado (Densidade média 1.25g/cm3)
            const peso = currentVol * 1.25 * infillPerc;
            
            // Tempo estimado simplificado (Volume + Fator de Qualidade)
            const tempoEstimado = (currentVol / 5) * qualityMult;
            
            const total = TAXA_SETUP + (peso * materialCusto) + (tempoEstimado * CUSTO_HORA);
            document.getElementById('total').innerText = "R$ " + total.toFixed(2).replace('.',',');
        }

        // Atualizar preço quando mudar qualquer opção
        document.querySelectorAll('select').forEach(s => s.onchange = updatePrice);

        function sendWA() {
            const total = document.getElementById('total').innerText;
            const dims = document.getElementById('dims').innerText;
            const text = window.encodeURIComponent(`Olá! Fiz um orçamento de impressão 3D:\n- Dimensões: ${dims} mm\n- Valor: ${total}\n\nEstou enviando o arquivo STL para análise.`);
            window.open(`https://wa.me/55XXXXXXXXXXX?text=${text}`); // SUBSTITUA PELO SEU NÚMERO
        }

        initThree();
        document.getElementById('drop-zone').onclick = () => document.getElementById('fileInput').click();
    </script>
</body>
</html>
